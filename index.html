<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Voice AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 18px;
        }

        h1 {
            color: #38bdf8;
            font-size: 36px;
        }

        textarea {
            width: 90%;
            height: 120px;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            margin: 15px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Voice AI 🎙️</h1>

        <h2>Your Voice, Your AI</h2>

        <p>Create speech using your own authorized voice.</p>

        <h3>Upload Your Voice</h3>

        <input type="file" accept="audio/*">

        <h3>Enter Your Text</h3>

        <textarea placeholder="Write something here..."></textarea>

        <br>

        <button>Generate Voice</button>

        <p>My Voice AI - Powered by AI</p>

    </div>

</body>
</html>
